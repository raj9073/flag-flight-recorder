name: Verify recorder

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.15"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --python "$(command -v python)"
      - name: Check replay prerequisites and run tests
        run: |
          .venv/bin/flight-recorder doctor
          .venv/bin/python -m pytest -q
      - name: Check source, build and install into a separate project
        if: matrix.python == '3.13'
        run: |
          .venv/bin/ruff check src examples tests
          .venv/bin/ruff format --check src examples tests
          .venv/bin/mypy
          node --check src/flag_flight_recorder/assets/report.js
          uv build --no-sources
          .venv/bin/python tests/installed_check.py dist/*.whl

  live:
    name: Self-hosted Flagsmith and browser
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      FFR_CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.15"
          enable-cache: false
      - name: Install the application and browser
        run: |
          uv sync --locked --group browser --python "$(command -v python)"
          .venv/bin/playwright install --with-deps chromium
      - name: Capture real HTTP requests and verify both fixes
        run: |
          .venv/bin/flight-recorder doctor --live
          .venv/bin/python -m examples.stack start
          .venv/bin/python -m examples.demo
      - name: Exercise the viewer and its downloadable tests
        run: |
          .venv/bin/flight-recorder serve .local/demo/evidence.html &
          viewer_pid=$!
          trap 'kill "$viewer_pid" 2>/dev/null || true' EXIT
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:13811/ -o /dev/null
          .venv/bin/python tests/browser_check.py --channel chromium --report .local/demo/evidence.html
          uv build --no-sources
          .venv/bin/python tests/installed_check.py dist/*.whl --archives .local/verification/ui
